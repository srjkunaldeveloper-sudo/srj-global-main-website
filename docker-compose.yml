services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: srjdocker123
      MYSQL_DATABASE: srj_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:8080
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: srjdocker123
      DB_NAME: srj_db
      JWT_SECRET: docker_dev_jwt_secret_change_me
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: placeholder_auth_token
      TWILIO_PHONE_NUMBER: "+10000000000"
      GROQ_API_KEY: ""
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
