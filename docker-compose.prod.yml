services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "0Ftu3xFNi0CEnSenf2Nohl7d"
      MYSQL_DATABASE: srj_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      ALLOWED_ORIGINS: "https://srjglobaltechnology.com,https://www.srjglobaltechnology.com"
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: "0Ftu3xFNi0CEnSenf2Nohl7d"
      DB_NAME: srj_db
      JWT_SECRET: "235ff9014b7ddbf218333c6102d1fd18c563d2e265a5b28fd1b4deec3ff2ed84"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: placeholder_auth_token
      TWILIO_PHONE_NUMBER: "+10000000000"
      GROQ_API_KEY: ""
    ports:
      - "127.0.0.1:5100:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8091:80"

volumes:
  mysql_data:
